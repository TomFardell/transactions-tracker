<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<title>Add Transaction</title>
	</head>

	<body>
		<h1 class="main-title">Add Transaction</h1>
		<p class="info"><b>Total</b>: <!--{{#sum transactions.amount}}--></p>

		<form method="post">
			<!--{{#iter num_add_transaction_inputs}}-->
			<input type="date" name="this.date">
			<input type="text" name="this.desc">
			<input type="text" name="this.amount">
			<br>
			<!--{{/iter}}-->
			<button class="button" type="submit" name="*instruction" value="*add_to-transactions">add</button>
			<button class="button" type="submit"  name="*instruction" value="*increment-num_add_transaction_inputs" <!--{{#if num_add_transaction_inputs >= 5}}-->disabled<!--{{/if}}-->>+</button>
			<button class="button" type="submit" name="*instruction" value="*decrement-num_add_transaction_inputs" <!--{{#if num_add_transaction_inputs <= 1}}-->disabled<!--{{/if}}-->>-</button>
		</form>
	</body>
</html>
