<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="styles.css">
		<title>Transactions</title>
	</head>

	<body>
		<h1 class="main-title">Transactions Tracker</h1>
		<p class="info"><b>Total</b>: <!--{{#sum transactions.desc}}--></p>

		<h2 class="sub-title">History</h2>
		<table class="table">
			<tr>
				<th>Description</th>
				<th>Date</th>
				<th>Amount</th>
			</tr>
			<!--{{#each transactions}}-->
			<tr>
				<td><!--{{this.desc}}--></td>
				<td><!--{{this.date}}--></td>
				<td><!--{{this.amount}}--></td>
			</tr>
			<!--{{/each}}-->
		</table>
	</body>
</html>
