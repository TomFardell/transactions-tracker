<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Transactions</title>
</head>

<body>
  <h1 class="main-title">Transactions Tracker</h1>
  <p class="info"><b>Total</b>: £35.98</p>

  <h2 class="sub-title">History</h2>
  <table class="table">
    <tr>
      <th>Description</th>
      <th>Date</th>
      <th>Amount</th>
    </tr>
    <tr>
      <td>Food</td>
      <td>20/05/2026</td>
      <td>£32.99</td>
    </tr>
    <tr>
      <td>Water</td>
      <td>18/05/2026</td>
      <td>£2.99</td>
    </tr>
  </table>
  <h2 class="sub-title">Add transaction</h2>
  <form method="post">
    <label for="desc">Description:</label>
    <input id="desc" name="desc" type="text" value="Internet">
    <label for="date">Date:</label>
    <input id="date" name="date" type="text" value="01/01/2026">
    <label for="amount">Amount:</label>
    <input id="amount" name="amount" type="text" value="27.99">
    <input type="submit" value="Add Transaction">
  </form>
</body>

</html>
